  2: "Nonmetropolitan urban"
  3: "Less urban"
  4: "Thinly populated"

Census_Region:
  1: "Northeast"
  2: "Midwest"
  3: "South"
  4: "West"

Climate_Zone:
  B: "Dry"
  C: "Temperate"
  D: "Continental"

Cluster_EQI:
  A: "Low-burden"
  B: "Mixed-burden"
  C: "High-burden"

Cluster_NLCD:
  A: "Natural"
  B: "Water-sensitive"
