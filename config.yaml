# WDP (WONDER Data Pipeline) Configuration File
# 配置文件 - 只包含路径设置

# 基础路径设置
base_paths:
  # WDP根目录（相对于此配置文件）
  wdp_root: "."
  # 主WONDER仓库路径（如果需要访问原始数据）
  wonder_root: ".."

# 数据目录设置
data_directories:
  # 原始数据目录
  original: "Data/Original"
  # 处理后数据目录
  processed: "Data/Processed"
  # 元数据目录
  metadata: "Data/Metadata"
  # 新增：长表/下游分析输入目录
  df: "Data/df"

# 结果目录设置
result_directories:
  # 筛选结果
  filter: "Result/Filter"
  # 分析结果
  analysis: "Result/Analysis"
  # 图表结果
  figures: "Result/Figures"
  # 表格结果
  tables: "Result/Tables"
  # EQI LMM分析结果
  eqi_lmm: "Result/EQI_LMM"
  # EQI LMM多重插补分析结果
  eqi_lmm_mi: "Result/EQI_LMM_MICE"

# 代码目录设置
code_directories:
  # 下载脚本
  download: "Code/Download"
  # 清洗脚本
  clean: "Code/Clean"
  # 筛选脚本
  filter: "Code/Filter"
  # 分析脚本
  analysis: "Code/Analysis"
  # 测试脚本
  test: "Code/Test"
  # 工具函数
  utils: "Code/Utils"

# 日志目录
log_directories:
  # 主日志目录
  main: "Logs"
  # 下载日志
  download: "Logs/Download"
  # 处理日志
  processing: "Logs/Processing"
  # 分析日志
  analysis: "Logs/Analysis"

# 数据源特定路径
data_sources:
  # CDC WONDER数据
  cdc_wonder:
    # 注意：为保持与磁盘一致，以下路径保持空格与大小写
    original: "Data/Original/ CDC WONDER"
    processed: "Data/Processed/CDC"
    # CDC WONDER 根目录（带空格），用于逐疾病子目录（如 C00-C97、C91-C95 等）
    integrity_base_dir: "Data/Original/ CDC WONDER"
    # CDC WONDER AAMR（年龄调整死亡率）原始数据目录
    aamr_original: "Data/Original/CDC WONDER AAMR"
    # AAMR 处理后输出文件命名：AAMR_{ICD}.csv（例如 AAMR_C81-C96.csv）
    aamr_output_pattern: "Data/Processed/CDC/AAMR_{ICD}.csv"
    # CDC WONDER EQI（环境质量指数相关癌症数据）
    eqi_original: "Data/Original/CDC WONDER EQI"
    eqi_processed: "Data/Processed/CDC"
    eqi_output_pattern: "Data/Processed/CDC/CDC_EQI_{time_period}.csv"
    eqi_suppression_threshold: 40.0
    # Location & Urbanization 源与输出
    location_urbanization_original: "Data/Original/ CDC WONDER/Location and Urbanization"
    location_output_file: "Data/Processed/CDC/Location.csv"
    urbanization_output_file: "Data/Processed/CDC/Urbanization.csv"
    download_urls:
      base: "https://wonder.cdc.gov/"

  # USGS PNSP农药数据
  usgs_pnsp:
    original: "Data/Original/USGS PNSP"
    processed: "Data/Processed/Pesticide"
    download_urls:
      base: "https://water.usgs.gov/nawqa/pnsp/usage/maps/county-level/PesticideUseEstimates/"
      filename_pattern: "EPest.county.estimates.{year}.txt"
    years:
      [
        1992,
        1993,
        1994,
        1995,
        1996,
        1997,
        1998,
        1999,
        2000,
        2001,
        2002,
        2003,
        2004,
        2005,
        2006,
        2007,
        2008,
        2009,
        2010,
        2011,
        2012,
        2013,
        2014,
        2015,
        2016,
        2017,
        2018,
        2019,
      ]

  # Environmental Data
  nldas:
    original: "Data/Original/NLDAS"
    processed: "Data/Processed/Environmental"
    download_urls:
      base: "https://hydro1.gesdisc.eosdis.nasa.gov/data/NLDAS/"
  gee:
    original: "Data/Original/GEE"
    processed: "Data/Processed/Environmental"
  air_pollution:
    original: "Data/Original/CACES LUR"
    processed: "Data/Processed/Environmental"
  tiger:
    shapefile: "Data/Original/County Shapeline/tl_2015_us_county.shp"

  # EPA Environmental Quality Index数据
  epa_eqi:
    original: "Data/Original/EPA EQI"
    processed: "Data/Processed/EQI"
    download_urls:
      base: "https://www.epa.gov/enviromatics-epa-environmental-quality-index"
      filename_pattern_0005: "00_05_EQI.csv"
      filename_pattern_0610: "06_10_EQI.csv"
    years:
      period1: "2000-2005"
      period2: "2006-2010"

  # Socioeconomic Data
  socioeconomic:
    saipe:
      original: "Data/Original/SAIPE"
      processed: "Data/Processed/Socioeconomic"
    laus:
      original: "Data/Original/LAUS"
      processed: "Data/Processed/Socioeconomic"
    bea:
      original: "Data/Original/BEA"
      processed: "Data/Processed/Socioeconomic"
    usda_ers:
      original: "Data/Original/USDA ERS"
      processed: "Data/Processed/Socioeconomic"
  seer_population:
    original: "Data/Original/SEER Population"
    processed: "Data/Processed/Socioeconomic"

# 新增：三类 EQI × CDC WONDER 合并长表输出位置
df_outputs:
  eqi_deaths: "Data/df/EQI_Deaths.csv"
  eqi_aamr_point: "Data/df/EQI_AAMR_Point.csv"
  eqi_aamr_interval: "Data/df/EQI_AAMR_Interval.csv"

# 新增：EQI AAMR数据统一输出目录
eqi_aamr_outputs:
  base_dir: "Data/Processed/df_EQI_AAMR"
  eqi_deaths: "EQI_Deaths.csv"
  eqi_aamr_point: "EQI_AAMR_Point.csv"
  eqi_aamr_interval: "EQI_AAMR_Interval.csv"

# Stratification label mappings
stratification_labels:
  # County Economic Typology (USDA ERS 2004)
  typology:
    "1": "Farming"
    "2": "Mining"
    "3": "Manufacturing"
    "4": "Government"
    "5": "Services"
    "6": "Nonspecialized"

  # Land Use Cluster (NLCD/JRC k=4)
  landuse:
    "0": "Natural"
    "1": "Water-Sensitive"
    "2": "Agricultural"
    "3": "Urban"

  # EQI Cluster mappings (k=3, k=4, k=5)
  cluster_k3:
    "0": "Low EQI"
    "1": "Medium EQI"
    "2": "High EQI"

  cluster_k4:
    "0": "Very Low EQI"
    "1": "Low EQI"
    "2": "Medium EQI"
    "3": "High EQI"

  cluster_k5:
    "0": "Very Low EQI"
    "1": "Low EQI"
    "2": "Medium EQI"
    "3": "High EQI"
    "4": "Very High EQI"

# PyMC分析配置
pymc_analysis:
  # 核心数据文件路径
  data_files:
    pca_covariates: "Data/Processed/PCA/PCA_Master_Covariables.csv"
    cdc_data_template: "Data/Processed/CDC/AAMR_{disease_code}.csv"
    cdc_eqi_template: "Data/Processed/CDC/CDC_EQI_{time_period}.csv"
    pesticide_data: "Data/Processed/Pesticide/PNSP.csv"
    pesticide_density_data: "Data/Processed/Pesticide/PNSP_Density.csv"
    adjacency_data: "Data/Processed/Socioeconomic/County_Adjacency_List.csv"
    pesticide_mapping: "Data/Processed/Pesticide/mapping.csv"

  # 输出配置
  output:
    base_dir: "Result/PyMC_Results"
    filename_template: "Results_{disease}_{exposure}_{timestamp}.csv"
    append_mode: true

  # 模型配置
  models:
    M0:
      name: "base"
      description: "Pesticide + spatial + temporal effects only"
      covariates: []
    M1:
      name: "socioeconomic"
      description: "Base + social vulnerability"
      covariates: ["SVI_std"]
    M2:
      name: "environmental"
      description: "Base + environmental factors"
      covariates: ["Climate1_std", "Climate2_std", "Climate3_std"]
    M3:
      name: "full"
      description: "Base + all covariates"
      covariates: ["SVI_std", "Climate1_std", "Climate2_std", "Climate3_std"]
    M5_SVI:
      name: "svi_interaction"
      description: "Full main effects + SVI * exposure interaction"
      covariates:
        [
          "SVI_std",
          "Climate1_std",
          "Climate2_std",
          "Climate3_std",
          "SVI_std * exposure",
        ]
    M6_ENV1:
      name: "env1_interaction"
      description: "Full main effects + Climate1 * exposure interaction"
      covariates:
        [
          "SVI_std",
          "Climate1_std",
          "Climate2_std",
          "Climate3_std",
          "Climate1_std * exposure",
        ]

  # 分析参数
  analysis:
    disease_codes: ["C81-C96", "C50", "C34"]
    lag_years: [5, 10]
    exposure_estimates: ["min", "avg", "max"]
    measure_types: ["Weight", "Density"]
    defaults:
      disease_code: "C81-C96"
      measure_type: "Weight"
      estimate_types: "avg"
      lag_years: 5
      model_types: "M0,M1,M2,M3"
      pesticide_category: "TEST"

  # 数据处理参数
  data_processing:
    year_range:
      start: 1999
      end: 2019
    min_thresholds:
      records_per_analysis: 100
      counties_per_analysis: 50
    exposure_processing:
      log_transform: true
      standardize: true
      outlier_detection: true
      outlier_method: "iqr"
      outlier_multiplier: 3.0

  # PyMC采样配置
  sampling:
    test:
      draws: 1000
      tune: 500
      chains: 2
      cores: 2
      target_accept: 0.8
    production:
      draws: 4000
      tune: 2000
      chains: 4
      cores: 4
      target_accept: 0.95
    default_mode: "test"

  # 模型拟合配置
  fitting:
    spatial:
      model_type: "bym2"
      use_car: true
      car_alpha_prior: 1.0
      spatial_sigma_prior: 1.0
    temporal:
      model_type: "rw1"
      temporal_sigma_prior: 1.0
    priors:
      intercept_sigma: 10.0
      exposure_sigma: 1.0
      covariate_sigma: 1.0

  # 输出格式配置
  output_format:
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    precision:
      rr: 4
      p_value: 3
    p_value_threshold: 0.05
    significant_markers:
      0.001: "***"
      0.01: "**"
      0.05: "*"

  # 质量控制
  quality_control:
    convergence:
      rhat_threshold: 1.01
      ess_threshold: 400
      check_enabled: true
    validation:
      rr_bounds: [0.1, 10.0]
      p_value_bounds: [0.0, 1.0]

  # 日志配置
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    progress_reporting: true
    save_log: false

  # 农药类别配置
  pesticide:
    exclude_categories: []
    priority_categories: []
    column_template: "cat{category_id}_{estimate}"
    test_categories: ["TEST"]
    batch_size: 5

# ── 疾病分类配置 ──────────────────────────────────────────────────────────────
#
# 两层结构：每种疾病分类（cvd / suicide / ndd / cancer）下有 overall 和 subtypes。
# 每个条目的字段说明：
#   fullname  : 疾病全称（用于展示）
#   shortname : 缩写（用于表格列名、图例等）
#   icd       : ICD-10 范围（仅用于注释，不影响计算）
#   icd_code  : 文件名中使用的 ICD 标识符，必须与 Subtracted/ 目录下的文件名一致
#               例：icd_code = "G30" 对应文件 "2006-2010_G30.csv"
#   downloaded: 是否从 CDC WONDER 直接下载了该 ICD 的数据
#               true  → 文件已下载，会被直接处理
#               false → 不下载，由 sum_of 列出的成分相加合成（见下）
#   sum_of    : 仅当 downloaded: false 时填写，列出用于合成该疾病的成分 icd_code 列表
#               合成逻辑：对每个 county × age group，将成分的 Deaths 累加后重新计算 AAMR
#
# !! 添加新疾病时的关键规则 !!
#
# 规则 1：选择正确的疾病组
#   cancer / ndd 组  → 增量法（incremental method）
#       Di = ALL_{ICD}(基线+目标) - ALL(基线)
#       CDC WONDER 下载的文件 ALL_{ICD} 是在"排除癌症/NDD以外所有疾病"的基础上
#       额外加入目标疾病，因此两文件相减即得目标疾病的死亡数。
#
#   cvd / suicide 组 → 减法（subtraction method）
#       Di = ALL_TRUE(全因) - ALL_{ICD}(残差)
#       CDC WONDER 下载的文件 ALL_{ICD} 是在全因死亡中排除目标疾病，
#       因此用真实全因死亡减去残差即得目标疾病的死亡数。
#       ⚠ 需要额外下载 All_Cause_of_Death 文件（真实全因死亡）。
#
# 规则 2：downloaded 与 sum_of 的互斥关系
#   downloaded: true  → 不填 sum_of（直接处理下载文件）
#   downloaded: false → 必须填 sum_of（由成分合成，不从 CDC 下载）
#   sum_of 中列出的每个成分必须是同一配置文件中已有的 icd_code，
#   且这些成分本身 downloaded: true（必须已下载）。
#
# 规则 3：新增疾病组时更新代码
#   cancer 和 ndd 组的 icd_code 自动进入 CANCER_NDD_CODES（增量法）。
#   新增 cvd / suicide 以外的其他疾病组，需在代码中
#   _build_cancer_ndd_codes() 的 group_key 列表里注册该组名，
#   才能正确判断使用哪种减法方式。
#
diseases:
  cvd:
    overall:
      fullname: "Disease of Circulatory System"
      shortname: "CVD"
      icd: "I00-I99"
      icd_code: "I00_I99"
      downloaded: true
    subtypes:
