      filename_pattern_0610: "06_10_EQI.csv"
    years:
      period1: "2000-2005"
      period2: "2006-2010"

  # Socioeconomic Data
  socioeconomic:
    saipe:
      original: "Data/Original/SAIPE"
      processed: "Data/Processed/Socioeconomic"
    laus:
      original: "Data/Original/LAUS"
      processed: "Data/Processed/Socioeconomic"
    bea:
