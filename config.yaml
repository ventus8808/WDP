# WDP (WONDER Data Pipeline) Configuration File
# 配置文件 - 只包含路径设置

# 基础路径设置
base_paths:
  # WDP根目录（相对于此配置文件）
  wdp_root: "."
  # 主WONDER仓库路径（如果需要访问原始数据）
  wonder_root: ".."

# 数据目录设置
data_directories:
  # 原始数据目录
  original: "Data/Original"
  # 处理后数据目录
  processed: "Data/Processed"
  # 元数据目录
  metadata: "Data/Metadata"
  # 新增：长表/下游分析输入目录
  df: "Data/df"

# 结果目录设置
result_directories:
  # 筛选结果
  filter: "Result/Filter"
  # 分析结果
  analysis: "Result/Analysis"
  # 图表结果
  figures: "Result/Figures"
  # 表格结果
  tables: "Result/Tables"
  # EQI LMM分析结果
  eqi_lmm: "Result/EQI_LMM"
  # EQI LMM多重插补分析结果
  eqi_lmm_mi: "Result/EQI_LMM_MICE"

# 代码目录设置
code_directories:
  # 下载脚本
  download: "Code/Download"
  # 清洗脚本
  clean: "Code/Clean"
  # 筛选脚本
  filter: "Code/Filter"
  # 分析脚本
  analysis: "Code/Analysis"
  # 测试脚本
  test: "Code/Test"
  # 工具函数
  utils: "Code/Utils"

# 日志目录
log_directories:
  # 主日志目录
  main: "Logs"
  # 下载日志
  download: "Logs/Download"
  # 处理日志
  processing: "Logs/Processing"
  # 分析日志
  analysis: "Logs/Analysis"

# 数据源特定路径
data_sources:
  # CDC WONDER数据
  cdc_wonder:
    # 注意：为保持与磁盘一致，以下路径保持空格与大小写
    original: "Data/Original/ CDC WONDER"
    processed: "Data/Processed/CDC"
    # CDC WONDER 根目录（带空格），用于逐疾病子目录（如 C00-C97、C91-C95 等）
    integrity_base_dir: "Data/Original/ CDC WONDER"
    # CDC WONDER AAMR（年龄调整死亡率）原始数据目录
    aamr_original: "Data/Original/CDC WONDER AAMR"
    # AAMR 处理后输出文件命名：AAMR_{ICD}.csv（例如 AAMR_C81-C96.csv）
    aamr_output_pattern: "Data/Processed/CDC/AAMR_{ICD}.csv"
    # CDC WONDER EQI（环境质量指数相关癌症数据）
    eqi_original: "Data/Original/CDC WONDER EQI"
    eqi_processed: "Data/Processed/CDC"
    eqi_output_pattern: "Data/Processed/CDC/CDC_EQI_{time_period}.csv"
    eqi_suppression_threshold: 40.0
    # Location & Urbanization 源与输出
    location_urbanization_original: "Data/Original/ CDC WONDER/Location and Urbanization"
    location_output_file: "Data/Processed/CDC/Location.csv"
    urbanization_output_file: "Data/Processed/CDC/Urbanization.csv"
    download_urls:
      base: "https://wonder.cdc.gov/"

  # USGS PNSP农药数据
  usgs_pnsp:
    original: "Data/Original/USGS PNSP"
    processed: "Data/Processed/Pesticide"
    download_urls:
      base: "https://water.usgs.gov/nawqa/pnsp/usage/maps/county-level/PesticideUseEstimates/"
      filename_pattern: "EPest.county.estimates.{year}.txt"
    years: [1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]

  # Environmental Data
  nldas:
    original: "Data/Original/NLDAS"
    processed: "Data/Processed/Environmental"
    download_urls:
      base: "https://hydro1.gesdisc.eosdis.nasa.gov/data/NLDAS/"
  gee:
    original: "Data/Original/GEE"
    processed: "Data/Processed/Environmental"
  air_pollution:
    original: "Data/Original/CACES LUR"
    processed: "Data/Processed/Environmental"
  tiger:
    shapefile: "Data/Original/County Shapeline/tl_2015_us_county.shp"
  
  # EPA Environmental Quality Index数据
  epa_eqi:
    original: "Data/Original/EPA EQI"
    processed: "Data/Processed/EQI"
    download_urls:
      base: "https://www.epa.gov/enviromatics-epa-environmental-quality-index"
      filename_pattern_0005: "00_05_EQI.csv"
      filename_pattern_0610: "06_10_EQI.csv"
    years:
      period1: "2000-2005"
      period2: "2006-2010"

  # Socioeconomic Data
  socioeconomic:
    saipe:
      original: "Data/Original/SAIPE"
      processed: "Data/Processed/Socioeconomic"
    laus:
      original: "Data/Original/LAUS"
      processed: "Data/Processed/Socioeconomic"
    bea:
      original: "Data/Original/BEA"
      processed: "Data/Processed/Socioeconomic"
    usda_ers:
      original: "Data/Original/USDA ERS"
      processed: "Data/Processed/Socioeconomic"
  seer_population:
    original: "Data/Original/SEER Population"
    processed: "Data/Processed/Socioeconomic"

# 新增：三类 EQI × CDC WONDER 合并长表输出位置
df_outputs:
  eqi_deaths: "Data/df/EQI_Deaths.csv"
  eqi_aamr_point: "Data/df/EQI_AAMR_Point.csv"
  eqi_aamr_interval: "Data/df/EQI_AAMR_Interval.csv"

# 新增：EQI AAMR数据统一输出目录
eqi_aamr_outputs:
  base_dir: "Data/Processed/df_EQI_AAMR"
  eqi_deaths: "EQI_Deaths.csv"
  eqi_aamr_point: "EQI_AAMR_Point.csv"
  eqi_aamr_interval: "EQI_AAMR_Interval.csv"

# PyMC分析配置
pymc_analysis:
  # 核心数据文件路径
  data_files:
    pca_covariates: "Data/Processed/PCA/PCA_Master_Covariables.csv"
    cdc_data_template: "Data/Processed/CDC/AAMR_{disease_code}.csv"
    cdc_eqi_template: "Data/Processed/CDC/CDC_EQI_{time_period}.csv"
    pesticide_data: "Data/Processed/Pesticide/PNSP.csv"
    pesticide_density_data: "Data/Processed/Pesticide/PNSP_Density.csv"
    adjacency_data: "Data/Processed/Socioeconomic/County_Adjacency_List.csv"
    pesticide_mapping: "Data/Processed/Pesticide/mapping.csv"

  # 输出配置
  output:
    base_dir: "Result/PyMC_Results"
    filename_template: "Results_{disease}_{exposure}_{timestamp}.csv"
    append_mode: true

  # 模型配置
  models:
    M0:
      name: "base"
      description: "Pesticide + spatial + temporal effects only"
      covariates: []
    M1:
      name: "socioeconomic"
      description: "Base + social vulnerability"
      covariates: ["SVI_std"]
    M2:
      name: "environmental"
      description: "Base + environmental factors"
      covariates: ["Climate1_std", "Climate2_std", "Climate3_std"]
    M3:
      name: "full"
      description: "Base + all covariates"
      covariates: ["SVI_std", "Climate1_std", "Climate2_std", "Climate3_std"]
    M5_SVI:
      name: "svi_interaction"
      description: "Full main effects + SVI * exposure interaction"
      covariates: ["SVI_std", "Climate1_std", "Climate2_std", "Climate3_std", "SVI_std * exposure"]
    M6_ENV1:
      name: "env1_interaction"
      description: "Full main effects + Climate1 * exposure interaction"
      covariates: ["SVI_std", "Climate1_std", "Climate2_std", "Climate3_std", "Climate1_std * exposure"]

  # 分析参数
  analysis:
    disease_codes: ["C81-C96", "C50", "C34"]
    lag_years: [5, 10]
    exposure_estimates: ["min", "avg", "max"]
    measure_types: ["Weight", "Density"]
    defaults:
      disease_code: "C81-C96"
      measure_type: "Weight"
      estimate_types: "avg"
      lag_years: 5
      model_types: "M0,M1,M2,M3"
      pesticide_category: "TEST"

  # 数据处理参数
  data_processing:
    year_range:
      start: 1999
      end: 2019
    min_thresholds:
      records_per_analysis: 100
      counties_per_analysis: 50
    exposure_processing:
      log_transform: true
      standardize: true
      outlier_detection: true
      outlier_method: "iqr"
      outlier_multiplier: 3.0

  # PyMC采样配置
  sampling:
    test:
      draws: 1000
      tune: 500
      chains: 2
      cores: 2
      target_accept: 0.8
    production:
      draws: 4000
      tune: 2000
      chains: 4
      cores: 4
      target_accept: 0.95
    default_mode: "test"

  # 模型拟合配置
  fitting:
    spatial:
      model_type: "bym2"
      use_car: true
      car_alpha_prior: 1.0
      spatial_sigma_prior: 1.0
    temporal:
      model_type: "rw1"
      temporal_sigma_prior: 1.0
    priors:
      intercept_sigma: 10.0
      exposure_sigma: 1.0
      covariate_sigma: 1.0

  # 输出格式配置
  output_format:
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    precision:
      rr: 4
      p_value: 3
    p_value_threshold: 0.05
    significant_markers:
      0.001: "***"
      0.01: "**"
      0.05: "*"

  # 质量控制
  quality_control:
    convergence:
      rhat_threshold: 1.01
      ess_threshold: 400
      check_enabled: true
    validation:
      rr_bounds: [0.1, 10.0]
      p_value_bounds: [0.0, 1.0]

  # 日志配置
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    progress_reporting: true
    save_log: false

  # 农药类别配置
  pesticide:
    exclude_categories: []
    priority_categories: []
    column_template: "cat{category_id}_{estimate}"
    test_categories: ["TEST"]
    batch_size: 5

# brms 分析配置（Bayesian multilevel interval regression）
# 核心优势：原生支持区间审查回归，能正确建模AAMR区间估计的不确定性
# 与LMM对比：LMM使用点估计，BRMS使用区间估计，提供更准确的不确定性量化
brms_analysis:
  # 数据输入 - 使用区间估计数据源（BRMS的核心优势）
  data_file: "Data/Processed/df_EQI_AAMR/EQI_AAMR_Interval.csv"

  # 结果输出目录 - 简化版本，与LMM对齐
  results:
    output_dir: "Result/brms"
    filename_template: "brms_{cancer_type}_Results.csv"

  # 采样与后端设置
  settings:
    chains: 2
    iter: 1000
    warmup: 500
    cores: 2
    seed: 12345
    backend: "rstan"
    adapt_delta: 0.95
    max_treedepth: 12

  # 先验设置
  priors:
    default:
      intercept:
        strategy: "auto_center"
        fallback_mean: 100.0
        fallback_sd: 50.0
      fixed_effects:
        class_b_sd: 5.0
      sigma:
        type: "student_t"
        df: 3
        scale: 30.0
      random_effects:
        state_sd:
          type: "student_t"
          df: 3
          scale: 20.0
    tight:
      intercept:
        strategy: "auto_center"
        fallback_mean: 100.0
        fallback_sd: 25.0
      fixed_effects:
        class_b_sd: 2.0
      sigma:
        type: "student_t"
        df: 3
        scale: 20.0
      random_effects:
        state_sd:
          type: "student_t"
          df: 3
          scale: 10.0

  # EQI列映射 - 解耦硬编码依赖
  eqi_column_map:
    no_rucc:
      total: "EQI"
      air: "EQI_Air"
      water: "EQI_Water"
      land: "EQI_Land"
      built: "EQI_Built"
      sociodemographic: "EQI_Social"   # Source data uses EQI_Social (keep output label Social)
    with_rucc:
      total: "RUCC_EQI"
      air: "RUCC_EQI_Air"
      water: "RUCC_EQI_Water"
      land: "RUCC_EQI_Land"
      built: "RUCC_EQI_Built"
      sociodemographic: "RUCC_EQI_Social"

  # 模型公式定义 - 区间回归是BRMS的核心优势
  formulas:
    # 模型1: 总EQI模型 (区间回归)
    total_eqi: "EQI_quintile + Smoking_Rate_std + (1 | State)"
    # 模型2: EQI细分域联合模型（5个域同时在一个模型里，区间回归）
    multi_eqi_domains: "EQI_air_quintile + EQI_water_quintile + EQI_land_quintile + EQI_built_quintile + EQI_sociodemographic_quintile + Smoking_Rate_std + (1 | State)"

  # 字段映射
  field_map:
    state: "State"
    cancer_type: "Cancer_Type"
    rucc: "RUCC"
    eqi_total: "EQI"
    eqi_quintile: "EQI"
    aamr_lower: "AAMR_lower"
    aamr_upper: "AAMR_upper"
    smoking_rate: "Smoking_Rate"

  # 分析参数 - 与LMM系统完全对齐的场景定义
  analysis_parameters:
    # 基础参数 - 与LMM all_cancer_types对齐
    cancer_types: [
      "C00_C97",     # All Cancers
      "C15_C26",     # Digestive Organs
      "C18_C21",     # Colorectal
      "C25",         # Pancreas
      "C30_C39",     # Respiratory
      "C34",         # Lung Cancer
      "C50",         # Breast Cancer
      "C51_C58",     # Female Genital
      "C60_C63",     # Male Genital
      "C61",         # Prostate
      "C64_C68",     # Urinary Tract
      "C76_C80",     # Ill-defined
      "C81_C96"      # Lymphoid/Hematologic
    ]
    
    # EQI时期和AAMR时期的组合 - 与LMM all_scenarios对齐
    scenario_combinations:
      - eqi_period: "0005"
        aamr_period: "2006-2010"
        lag_years: 5
        scenario_name: "EQI0005_AAMR2006_2010"
      - eqi_period: "0005"
        aamr_period: "2011-2015"
        lag_years: 10
        scenario_name: "EQI0005_AAMR2011_2015"
      - eqi_period: "0610"
        aamr_period: "2011-2015"
        lag_years: 5
        scenario_name: "EQI0610_AAMR2011_2015"
      - eqi_period: "0610"
        aamr_period: "2016-2020"
        lag_years: 10
        scenario_name: "EQI0610_AAMR2016_2020"
    
    # 模型类型定义 - 两种不同的模型结构
    model_types:
      - name: "EQI"
        description: "总EQI模型"
        formula_type: "total_eqi"
      - name: "EQI_domains"  
        description: "EQI细分域联合模型（5个域在一个模型里）"
        formula_type: "multi_eqi_domains"
    
    # RUCC分层设置 - 与LMM rucc_eqi_variables对齐
    rucc_strata:
      - name: null
        description: "全体分析"
        rucc_codes: null
      - name: "RUCC1"
        description: "RUCC类别1"
        rucc_codes: [1]
      - name: "RUCC2"
        description: "RUCC类别2"
        rucc_codes: [2]
      - name: "RUCC3"
        description: "RUCC类别3"
        rucc_codes: [3]
      - name: "RUCC4"
        description: "RUCC类别4"
        rucc_codes: [4]
    
    # 模型设置（保持不变）
    model_settings:
      formula_key: "total_eqi_quintile"
      prior_key: "default"
      family: "gaussian"
      use_midpoint: false
  
  # MCMC采样设置 - 自动并行计算优化
  mcmc_settings:
    auto_cores: true           # 自动检测核心数
    cores_fraction: 0.8        # 使用80%的核心
    chains: 4                  # 链数
    iter: 2000                 # 总迭代次数
    warmup: 1000              # 预热迭代次数
    max_treedepth: 12         # 最大树深度
    adapt_delta: 0.95         # 适应参数
    seed: 12345               # 随机种子

# EQI LMM多重插补分析配置
eqi_lmm_multiple_imputation:
  # 基础设置
  n_imputations: 20              # 插补次数
  max_iterations: 10             # MICE最大迭代次数
  random_seed: 42               # 随机种子
  convergence_threshold: 0.01    # 收敛阈值
  
  # 数据路径
  data_paths:
    mi_source: "Data/df/EQI_LMM_MI_df.csv"
    mi_datasets_dir: "Data/df/MI_Datasets"
    diagnostics_dir: "Data/MI_Diagnostics"
  
  # 结果路径
  result_paths:
    base_dir: "Result/EQI_LMM_MICE"
    individual_results: "Result/EQI_LMM_MICE/Individual_Results"
    pooled_results: "Result/EQI_LMM_MICE/Pooled_Results"
    mi_diagnostics: "Result/EQI_LMM_MICE/MI_Diagnostics"
  
  # 插补设置
  imputation_settings:
    method: "mice"                # 插补方法 (MICE/FCS)
    predictive_mean_matching: true # 使用PMM处理连续变量
    min_observed_ratio: 0.1       # 最小观测比例
    auxiliary_variables:          # 辅助变量
      - "RUCC"
      - "STATE_FIPS"
      - "Population"
      - "Area"
    
  # 变量特定插补方法
  variable_methods:
    AAMR: "pmm"                   # 预测均值匹配
    EQI: "pmm"
    EQI_air: "pmm" 
    EQI_water: "pmm"
    EQI_land: "pmm"
    EQI_built: "pmm"
    EQI_Sociodemographic: "pmm"
    SR: "pmm"                     # 吸烟率
    
  # 质量控制
  quality_control:
    check_convergence: true       # 检查收敛性
    plot_diagnostics: true        # 生成诊断图
    validate_distributions: true   # 验证分布匹配
    
  # 池化设置
  pooling_settings:
    confidence_level: 0.95        # 置信水平
    rubin_rules: true             # 使用Rubin规则
    calculate_fmi: true           # 计算缺失信息分数
    
  # 并行处理
  parallel_processing:
    enabled: true                 # 启用并行处理
    n_cores: 4                   # 使用核心数
    batch_size: 5                # 批处理大小
