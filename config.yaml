      processed: "Data/Processed/Socioeconomic"
      typology_source: "2004CountyTypologyCode.xls"
      typology_output: "Data/Processed/Covariate/Economic_type.csv"
  seer_population:
    original: "Data/Original/SEER Population"
    processed: "Data/Processed/Socioeconomic"

# ── 疾病分类配置 ──────────────────────────────────────────────────────────────
#
# 两层结构：每种疾病分类（cvd / suicide / ndd / cancer）下有 overall 和 subtypes。
# 每个条目的字段说明：
#   fullname  : 疾病全称（用于展示）
#   shortname : 缩写（用于表格列名、图例等）
#   icd       : ICD-10 范围（仅用于注释，不影响计算）
#   icd_code  : 文件名中使用的 ICD 标识符，必须与 Subtracted/ 目录下的文件名一致
#               例：icd_code = "G30" 对应文件 "2006-2010_G30.csv"
#   downloaded: 是否从 CDC WONDER 直接下载了该 ICD 的数据
#               true  → 文件已下载，会被直接处理
#               false → 不下载，由 sum_of 列出的成分相加合成（见下）
#   sum_of    : 仅当 downloaded: false 时填写，列出用于合成该疾病的成分 icd_code 列表
#               合成逻辑：对每个 county × age group，将成分的 Deaths 累加后重新计算 AAMR
#
# !! 添加新疾病时的关键规则 !!
#
# 规则 1：所有疾病组均使用相同的减法方式（subtraction method）
#   Di = ALL_TRUE(全因) - ALL_{ICD}(残差)
#   CDC WONDER 下载的文件 ALL_{ICD} 是在全因死亡中排除目标疾病后的残差，
#   用真实全因死亡（All_Cause_of_Death 文件）减去残差即得目标疾病死亡数。
#   ⚠ 需要额外下载每个时期的 All_Cause_of_Death 文件。
#
# 规则 2：downloaded / sum_of / summarize 字段说明
#   downloaded: true  → 文件已从 CDC WONDER 下载，直接参与减法计算，不填 sum_of
#   downloaded: false → 不下载，由 sum_of 列出的成分相加合成，必须填 sum_of
#                       sum_of 成分必须在 Subtracted/ 目录中先于本条目存在
#                       （成分先执行减法，再执行合成；config 中顺序即执行顺序）
#   summarize: false  → 该条目仅作为其他合成条目的成分，不单独出现在汇总表中
#
# 规则 3：新增疾病组
#   直接在 diseases 下新增组；代码通过 _build_icd_to_group() 自动读取全部组。
#   如需跳过某组，在脚本顶部的 SKIP_GROUPS 中将该组名设为 0。
#
diseases:
  liver:
    overall:
      fullname: "Chronic Liver Disease"
      shortname: "CLD"
      icd: "K70-K76+C22"
      icd_code: "K70_K76_C22"
