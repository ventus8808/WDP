# brms 分析配置（Bayesian multilevel interval regression）
# 核心优势：原生支持区间审查回归，能正确建模AAMR区间估计的不确定性
# 与LMM对比：LMM使用点估计，BRMS使用区间估计，提供更准确的不确定性量化
brms_analysis:
  # 数据输入 - 使用区间估计数据源（BRMS的核心优势）
  data_file: "Data/Processed/df_EQI_AAMR/EQI_AAMR_Interval.csv"

  # 结果输出目录 - 简化版本，与LMM对齐
  results:
    output_dir: "Result/brms"
    filename_template: "brms_{cancer_type}_Results.csv"

  # 采样与后端设置
  settings:
    chains: 2
    iter: 1000
    warmup: 500
    cores: 2
    seed: 12345
    backend: "rstan"
    adapt_delta: 0.95
    max_treedepth: 12

  # 先验设置
  priors:
    default:
      intercept:
        strategy: "auto_center"
        fallback_mean: 100.0
        fallback_sd: 50.0
      fixed_effects:
        class_b_sd: 5.0
      sigma:
        type: "student_t"
        df: 3
        scale: 30.0
      random_effects:
        state_sd:
          type: "student_t"
          df: 3
          scale: 20.0
    tight:
      intercept:
        strategy: "auto_center"
        fallback_mean: 100.0
        fallback_sd: 25.0
      fixed_effects:
        class_b_sd: 2.0
      sigma:
        type: "student_t"
        df: 3
        scale: 20.0
      random_effects:
        state_sd:
          type: "student_t"
          df: 3
          scale: 10.0

  # EQI列映射 - 解耦硬编码依赖
  eqi_column_map:
    no_rucc:
      total: "EQI"
      air: "EQI_Air"
      water: "EQI_Water"
      land: "EQI_Land"
      built: "EQI_Built"
      sociodemographic: "EQI_Social" # Source data uses EQI_Social (keep output label Social)
    with_rucc:
      total: "RUCC_EQI"
      air: "RUCC_EQI_Air"
      water: "RUCC_EQI_Water"
      land: "RUCC_EQI_Land"
      built: "RUCC_EQI_Built"
      sociodemographic: "RUCC_EQI_Social"

  # 模型公式定义 - 区间回归是BRMS的核心优势
  formulas:
    # 模型1: 总EQI模型 (区间回归)
    total_eqi: "EQI_quintile + Smoking_Rate_std + (1 | State)"
    # 模型2: EQI细分域联合模型（5个域同时在一个模型里，区间回归）
    multi_eqi_domains: "EQI_air_quintile + EQI_water_quintile + EQI_land_quintile + EQI_built_quintile + EQI_sociodemographic_quintile + Smoking_Rate_std + (1 | State)"

  # 字段映射
  field_map:
    state: "State"
    cancer_type: "Cancer_Type"
    rucc: "RUCC"
    eqi_total: "EQI"
    eqi_quintile: "EQI"
    aamr_lower: "AAMR_lower"
    aamr_upper: "AAMR_upper"
    smoking_rate: "Smoking_Rate"

  # ICD-10 代码映射到癌症名称
  icd_mapping:
    "C00_C97": "All-site Cancer"
    "C15_C26": "Digestive System Cancer"
    "C18_C21": "Colorectal Cancer"
    "C22": "Liver Cancer"
    "C25": "Pancreatic Cancer"
    "C30_C39": "Respiratory System Cancer"
    "C34": "Lung Cancer"
    "C40_C41": "Bone and Articular Cartilage Cancer"
    "C43_C44": "Skin Cancer"
    "C45_C49": "Mesothelial and Soft Tissue Cancer"
    "C50": "Breast Cancer"
    "C51_C58": "Female Genital Organs Cancer"
    "C60_C63": "Male Genital Organs Cancer"
    "C61": "Prostate Cancer"
    "C64_C68": "Urinary Tract Cancer"
    "C64": "Kidney Cancer"
    "C67": "Bladder Cancer"
    "C69_C72": "Brain and Central Nervous System Cancer"
    "C73_C75": "Thyroid and Endocrine Glands Cancer"
    "C76_C80": "Ill-defined and Secondary Sites Cancer"
    "C81_C96": "Lymphoid and Hematopoietic Cancer"
    "C82_C86": "Non-Hodgkin Lymphoma"
    "C91_C95": "Leukemia"
    "C97": "Multiple Primary Sites Cancer"
    "G10": "Huntington's Disease (HD)"
    "G20": "Parkinson's Disease (PD)"
    "G30": "Alzheimer's Disease (AD)"
    "G12.2": "Amyotrophic Lateral Sclerosis (ALS)"
    "F01": "Vascular Dementia (VD)"
    "F03": "Unspecified Dementia (UD)"
    "G20_G30_G12.2_F01_F03": "Neurodegenerative Disease (NDD)"
    "G30_F01_F03": "Dementia (AD+VD+UD)"
    "C82_C85": "Non-Hodgkin Lymphoma"
    "C64_C65": "Kidney and Renal Pelvis Cancer"
    "C56": "Ovary Cancer"

  # 分析参数 - 与LMM系统完全对齐的场景定义
  analysis_parameters:
    # 基础参数 - 与LMM all_cancer_types对齐
    cancer_types: [
        "C00_C97", # All Cancers
        "C15_C26", # Digestive Organs
        "C18_C21", # Colorectal
        "C25", # Pancreas
        "C30_C39", # Respiratory
        "C34", # Lung Cancer
        "C50", # Breast Cancer
        "C51_C58", # Female Genital
        "C60_C63", # Male Genital
        "C61", # Prostate
        "C64_C68", # Urinary Tract
        "C76_C80", # Ill-defined
        "C81_C96", # Lymphoid/Hematologic
      ]

    # EQI时期和AAMR时期的组合 - 与LMM all_scenarios对齐
    scenario_combinations:
      - eqi_period: "0005"
        aamr_period: "2006-2010"
        lag_years: 5
        scenario_name: "EQI0005_AAMR2006_2010"
      - eqi_period: "0005"
        aamr_period: "2011-2015"
        lag_years: 10
        scenario_name: "EQI0005_AAMR2011_2015"
      - eqi_period: "0610"
        aamr_period: "2011-2015"
        lag_years: 5
        scenario_name: "EQI0610_AAMR2011_2015"
      - eqi_period: "0610"
        aamr_period: "2016-2020"
        lag_years: 10
        scenario_name: "EQI0610_AAMR2016_2020"

    # 模型类型定义 - 两种不同的模型结构
    model_types:
      - name: "EQI"
        description: "总EQI模型"
        formula_type: "total_eqi"
      - name: "EQI_domains"
        description: "EQI细分域联合模型（5个域在一个模型里）"
        formula_type: "multi_eqi_domains"

    # RUCC分层设置 - 与LMM rucc_eqi_variables对齐
    rucc_strata:
      - name: null
        description: "全体分析"
        rucc_codes: null
      - name: "RUCC1"
        description: "RUCC类别1"
        rucc_codes: [1]
      - name: "RUCC2"
        description: "RUCC类别2"
        rucc_codes: [2]
      - name: "RUCC3"
        description: "RUCC类别3"
        rucc_codes: [3]
      - name: "RUCC4"
        description: "RUCC类别4"
        rucc_codes: [4]

    # 模型设置（保持不变）
    model_settings:
      formula_key: "total_eqi_quintile"
      prior_key: "default"
      family: "gaussian"
      use_midpoint: false

  # MCMC采样设置 - 自动并行计算优化
  mcmc_settings:
    auto_cores: true # 自动检测核心数
    cores_fraction: 0.8 # 使用80%的核心
    chains: 4 # 链数
    iter: 2000 # 总迭代次数
    warmup: 1000 # 预热迭代次数
    max_treedepth: 12 # 最大树深度
    adapt_delta: 0.95 # 适应参数
    seed: 12345 # 随机种子

# EQI LMM多重插补分析配置
eqi_lmm_multiple_imputation:
  # 基础设置
  n_imputations: 20 # 插补次数
  max_iterations: 10 # MICE最大迭代次数
  random_seed: 42 # 随机种子
  convergence_threshold: 0.01 # 收敛阈值

  # 数据路径
  data_paths:
    mi_source: "Data/df/EQI_LMM_MI_df.csv"
    mi_datasets_dir: "Data/df/MI_Datasets"
    diagnostics_dir: "Data/MI_Diagnostics"

  # 结果路径
  result_paths:
    base_dir: "Result/EQI_LMM_MICE"
    individual_results: "Result/EQI_LMM_MICE/Individual_Results"
    pooled_results: "Result/EQI_LMM_MICE/Pooled_Results"
    mi_diagnostics: "Result/EQI_LMM_MICE/MI_Diagnostics"

  # 插补设置
  imputation_settings:
    method: "mice" # 插补方法 (MICE/FCS)
    predictive_mean_matching: true # 使用PMM处理连续变量
    min_observed_ratio: 0.1 # 最小观测比例
    auxiliary_variables: # 辅助变量
      - "RUCC"
      - "STATE_FIPS"
      - "Population"
      - "Area"

  # 变量特定插补方法
  variable_methods:
    AAMR: "pmm" # 预测均值匹配
    EQI: "pmm"
    EQI_air: "pmm"
    EQI_water: "pmm"
    EQI_land: "pmm"
    EQI_built: "pmm"
    EQI_Sociodemographic: "pmm"
    SR: "pmm" # 吸烟率

  # 质量控制
  quality_control:
    check_convergence: true # 检查收敛性
    plot_diagnostics: true # 生成诊断图
    validate_distributions: true # 验证分布匹配

  # 池化设置
  pooling_settings:
    confidence_level: 0.95 # 置信水平
    rubin_rules: true # 使用Rubin规则
    calculate_fmi: true # 计算缺失信息分数

  # 并行处理
  parallel_processing:
    enabled: true # 启用并行处理
    n_cores: 4 # 使用核心数
    batch_size: 5 # 批处理大小
