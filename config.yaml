    # 模型类型定义 - 两种不同的模型结构
    model_types:
      - name: "EQI"
        description: "总EQI模型"
        formula_type: "total_eqi"
      - name: "EQI_domains"
        description: "EQI细分域联合模型（5个域在一个模型里）"
        formula_type: "multi_eqi_domains"

    # RUCC分层设置 - 与LMM rucc_eqi_variables对齐
    rucc_strata:
      - name: null
        description: "全体分析"
        rucc_codes: null
      - name: "RUCC1"
